[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "brownfield-cartographer"
version = "1.0.0"
description = "Multi-agent codebase intelligence system for rapid FDE onboarding in production environments"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    # CLI
    "typer[all]>=0.12.0",
    "rich>=13.7.0",

    # Pydantic models
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",

    # AST / Static analysis
    "tree-sitter>=0.22.0",
    "tree-sitter-python>=0.22.0",
    "tree-sitter-sql>=0.3.0",
    "tree-sitter-yaml>=0.3.0",
    "tree-sitter-javascript>=0.22.0",
    "tree-sitter-typescript>=0.22.0",

    # SQL lineage
    "sqlglot>=23.14.0",

    # Graph analysis
    "networkx>=3.3",

    # Git integration
    "gitpython>=3.1.43",

    # YAML parsing
    "PyYAML>=6.0.1",

    # Notebook parsing
    "nbformat>=5.10.4",

    # LLM / AI
    "anthropic>=0.28.0",
    "openai>=1.30.0",
    "langchain>=0.2.0",
    "langchain-anthropic>=0.1.15",
    "langchain-openai>=0.1.8",
    "langgraph>=0.1.0",

    # Vector store / embeddings
    "chromadb>=0.5.0",
    "sentence-transformers>=3.0.0",
    "scikit-learn>=1.4.0",

    # HTTP / GitHub
    "httpx>=0.27.0",

    # Utilities
    "python-dotenv>=1.0.1",
    "tenacity>=8.3.0",
    "structlog>=24.2.0",
    "tiktoken>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "types-PyYAML",
    "types-networkx",
]

[project.scripts]
cartographer = "src.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "W", "I", "N", "UP", "S", "B", "A", "C4", "T20"]
ignore = ["S101", "T201"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing --cov-fail-under=70"

[tool.coverage.run]
source = ["src"]
omit = ["tests/*"]
